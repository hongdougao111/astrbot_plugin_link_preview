name: astrbot_plugin_link_preview
display_name: 链接解析
short_desc: 聊天里丢链接自动解析，B站视频直接下下来发群
desc: |
  发链接就行，不用打指令。B 站链接会把视频下载下来直接发出去，
  其他链接回标题、来源、简介和封面图。

  平台支持：
  - 哔哩哔哩：走官方 x/web-interface/view + x/player/playurl 接口，
    拿 durl 合并流（音视频已并好），标题、UP 主、时长齐全，支持 b23.tv 短链
  - 网易云音乐：走 api/song/detail，歌名、歌手、专辑、封面
  - 其他网页：og:title / og:description / og:image / title / description

  主要能力：
  - 视频流式下载，边收边写边数字节，超上限立刻中止，不会写满磁盘
  - 封面图落盘缓存，规避平台防盗链（B 站图床查 Referer）
  - 缓存键用 bvid + 清晰度，直链签名变化不会重复下载
  - 按会话开关，一个群关掉不影响别的群，状态落盘重启不丢
  - 域名白名单 / 黑名单、单条消息解析数量、会话冷却都可配
  - 失败静默，不刷报错

  点歌：/点 歌名 或 /点 歌手，搜到能播的直接发语音。

  指令只有两个（管理员）：/解析 看状态，/解析 开|关 切换；点歌是 /点。
version: 1.1.7
author: hongdougao111
repo: https://github.com/hongdougao111/astrbot_plugin_link_preview
astrbot_version: ">=4.9.2"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - slack
tags:
  - 工具
  - 链接
  - 预览
  - 视频下载
  - B站